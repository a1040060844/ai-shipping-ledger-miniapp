name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  miniapp-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check mini program JavaScript syntax
        run: find miniprogram -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate mini program JSON and declared pages
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const app = JSON.parse(fs.readFileSync('miniprogram/app.json', 'utf8'))
          for (const page of app.pages) {
            for (const ext of ['js', 'json', 'wxml', 'wxss']) {
              const file = path.join('miniprogram', `${page}.${ext}`)
              if (!fs.existsSync(file)) throw new Error(`Missing declared page file: ${file}`)
              if (ext === 'json') JSON.parse(fs.readFileSync(file, 'utf8'))
            }
          }
          JSON.parse(fs.readFileSync('miniprogram/app.json', 'utf8'))
          console.log(`Validated ${app.pages.length} mini program pages`)
          NODE

  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: npx prisma generate
      - run: npm run build

  ubuntu24-deploy-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n deploy/ubuntu24/bootstrap.sh
          bash -n deploy/ubuntu24/deploy-app.sh
          bash -n deploy/ubuntu24/backup.sh
          bash -n deploy/ubuntu24/verify.sh
      - name: Reject secrets accidentally committed to deployment files
        run: |
          ! grep -R -E 'DASHSCOPE_API_KEY=(sk-|[A-Za-z0-9]{30,})' deploy/ubuntu24 CODEX_DEPLOY.md
