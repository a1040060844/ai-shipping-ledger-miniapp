name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: npx prisma generate
      - run: npm run build

  ubuntu24-deploy-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n deploy/ubuntu24/bootstrap.sh
          bash -n deploy/ubuntu24/deploy-app.sh
          bash -n deploy/ubuntu24/backup.sh
          bash -n deploy/ubuntu24/verify.sh
      - name: Reject secrets accidentally committed to deployment files
        run: |
          ! grep -R -E 'DASHSCOPE_API_KEY=(sk-|[A-Za-z0-9]{30,})' deploy/ubuntu24 CODEX_DEPLOY.md
