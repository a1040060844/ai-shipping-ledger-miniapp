# Include this file INSIDE the HTTPS server {} block of the selected domain.
# It deliberately does not define server_name/root so it cannot replace an existing website.

location = /shipping-ledger-api {
    return 308 /shipping-ledger-api/;
}

location /shipping-ledger-api/ {
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Trailing slash strips /shipping-ledger-api/ before forwarding.
    proxy_pass http://127.0.0.1:3000/;
}
